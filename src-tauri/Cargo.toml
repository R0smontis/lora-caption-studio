[package]
name = "lora-caption-studio"
version = "0.1.0"
description = "LoRA image caption generation, revision and dataset text editor"
authors = ["Local"]
edition = "2021"

[lib]
name = "lora_caption_studio_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", default-features = false, features = ["test", "wry", "compression", "dynamic-acl", "x11", "dbus"] }
serde = { version = "1", features = ["derive"] }
fastrand = "2"
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "fs", "macros"] }
tokio-util = "0.7"
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = "0.3"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
rfd = "0.15"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "bmp", "tiff"] }
mime_guess = "2"
walkdir = "2"
regex = "1"
unicode-normalization = "0.1"
encoding_rs = "0.8"
ort = { version = "2.0.0-rc.13", default-features = false, features = ["ndarray", "load-dynamic", "cuda"] }
ndarray = "0.17"
parking_lot = "0.12"
sha2 = "0.10"
urlencoding = "2"
windows-sys = { version = "0.61", features = ["Win32_Security_Cryptography", "Win32_System_Memory", "Win32_Storage_FileSystem"] }

[dev-dependencies]
tempfile = "3"
tiny_http = "0.12"
